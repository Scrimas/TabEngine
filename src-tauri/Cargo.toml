[package]
name        = "tabengine"
version     = "0.3.0"
description = "TabEngine — Guitar Tablature Player"
authors     = ["Scrimas"]
license     = "GPL-3.0-or-later"
edition     = "2021"
rust-version = "1.77"

# The lib crate is compiled for both the tauri runner and for tests.
# rlib only: staticlib/cdylib are for Tauri mobile targets, and every build
# (debug and release, even `cargo build --bins`) also archived a ~800 MB .a
# and LTO-linked a .so that nothing loads.
[lib]
name       = "tabengine_lib"
crate-type = ["rlib"]

# Binary name is capitalized to match `productName` in tauri.conf.json, so the
# built binary and desktop entry stay consistent with the app's branding.
[[bin]]
name = "TabEngine"
path = "src/main.rs"

# ── build ─────────────────────────────────────────────────────────────────────
[build-dependencies]
tauri-build = { version = "2", features = [] }

# ── runtime ───────────────────────────────────────────────────────────────────
[dependencies]
tauri          = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell  = "2"
tauri-plugin-window-state = "2"
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
reqwest        = { version = "0.12", features = ["json", "rustls-tls", "gzip"], default-features = false }
percent-encoding = "2"

# ── features ──────────────────────────────────────────────────────────────────
[features]
# custom-protocol bundles the Vite dist into the binary (production builds)
default          = ["custom-protocol"]
custom-protocol  = ["tauri/custom-protocol"]

# ── dev profile (`tauri dev`) ─────────────────────────────────────────────────
[profile.dev]
# Line tables are enough for panic backtraces; full DWARF made the debug
# binary 267 MB and dominated link time on every rebuild.
debug = "line-tables-only"

[profile.dev.package."*"]
# Optimise dependencies even in dev: tauri/serde_json/reqwest at opt-level 0
# make every IPC round-trip 10-50x slower than release. App code itself stays
# unoptimised for fast incremental rebuilds (one-time full dep rebuild).
opt-level = 2

# ── release profile ───────────────────────────────────────────────────────────
[profile.release]
panic         = "abort"    # smaller binary, faster fail
codegen-units = 1          # maximise optimisation
lto           = true
opt-level     = "s"        # optimise for size
strip         = true
